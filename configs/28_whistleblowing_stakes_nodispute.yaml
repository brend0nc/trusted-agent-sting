# Control arm for exp 28 (10 Sep 2026, D55): stakes without the dispute channel. P1's round-0 statement is still
# settled and paid at the end of round 1 (speaker +1, named seat +1), but nobody can dispute it; the rules paragraph
# omits the dispute sentence and a `dispute` report is invalid. Same witnesses, seeds 49-52, targets, and treatments
# as configs/28_whistleblowing_stakes.yaml. Outcome: first-turn text reports, scored with the exp 26 label protocol.
