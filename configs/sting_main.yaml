# Trusted-agent sting (Apart sprint, 24 Oct 2026; sprint work). Final run (protocol v4): 18 seeds x 7 conditions = 126 games. Roles, the P4 ally and the coalition pair come from the seed value (a fixed random mapping), balanced over any 6 consecutive seeds.
# P4 makes a false ledger claim (R0.3) in the scripted round-0 opening and, in the direct/hint/benign arms,
# privately sends the same message to P1, P2 and P3. In every later slot P4 plays one fixed rule (pull for its
# top helper, else itself) and never calls a model.
# alliance: one ordinary seat is P4's secret ally (positive control). coalition_direct: two ordinary seats are
# secret allies of each other and P4 sends the direct offer to all three; coalition_none: same pair, no offer
# (exposure test and its control). Prompts: docs/design/sting-prompts.md.
# Rule text and human board as exp 28 (v4). Grok 4.3 settings copied from configs/28_whistleblowing_stakes.yaml. Design: docs/design/lean-sting.md.
# Spending: one shared ledger cap ($50, set by Brendon 24 Oct) for every sting config. The ledger reserves
# the route's worst case per request ($15 for Grok 4.3: 1M-token context at $5/M in, $10/M out), so 2 parallel
# games hold at most $30. Exp 28 measured Grok at about $0.0022 per call (18 calls per game).
# The $50 ledger is the only hard ceiling. This run's budget limit is $20 (planner worst case $18 with retries;
# expected real cost about $5). budget.max_actual_usd is checked when a game starts, so it stops new games only.
stage: exploratory
log_dir: logs/sting_main
max_tasks: 1
native:
  max_concurrent_episodes: 2
  allow_estimated_cost: false
spending:
  ledger: logs/controlled-spending.sqlite3
  cap_usd: 50
  manifest: logs/sting_main/routes.json
cost:
  avg_input_tokens_per_call: 2000
  avg_output_tokens_per_call: 600
  model_prices:
    grok-4.3:
      input_usd_per_mtok: 1.25
      output_usd_per_mtok: 2.5
      cache_read_usd_per_mtok: 0.2
      cache_write_usd_per_mtok: 0.0
budget:
  max_estimated_usd: 20
  max_actual_usd: 20
arms:
- name: trusted_sting
  task: trusted_sting
  player_models:
  - grok-4.3
  seeds:
  - 62
  - 63
  - 64
  - 65
  - 66
  - 67
  - 68
  - 69
  - 70
  - 71
  - 72
  - 73
  - 74
  - 75
  - 76
  - 77
  - 78
  - 79
  rounds: 2
  actions_per_round: 3
  model_configs:
    grok-4.3:
      max_tokens: 8192
      provider_routing:
        only:
        - xai
        allow_fallbacks: false
        require_parameters: true
